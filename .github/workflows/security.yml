name: security

# 安全作业独立于 ci.yml：CI 的路径裁剪是 fail-open，安全门禁不能被静默跳过。
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每周一 11:23（UTC+8）：无代码变更也能发现新披露漏洞与新增规则命中。
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # gitleaks 扫全历史，浅克隆会漏掉既有提交
      - name: gitleaks
        run: |
          VERSION=8.30.1
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -sSfL "${BASE}/gitleaks_${VERSION}_checksums.txt" -o /tmp/gitleaks.sha
          curl -sSfL "${BASE}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          (cd /tmp && grep " gitleaks_${VERSION}_linux_x64.tar.gz\$" gitleaks.sha | sha256sum --check)
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks detect --source . --redact --verbose --exit-code 1

  # osv-scanner 扫 pom.xml（含传递依赖）；Maven 测试作用域依赖不在解析图中（上游限制）。
  deps:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: osv-scanner
        run: |
          VERSION=2.7.1
          BASE="https://github.com/google/osv-scanner/releases/download/v${VERSION}"
          BIN="/tmp/osv-scanner_linux_amd64"
          curl -sSfL "${BASE}/osv-scanner_linux_amd64" -o "${BIN}"
          curl -sSfL "${BASE}/osv-scanner_SHA256SUMS" -o /tmp/osv-scanner_SHA256SUMS
          (cd /tmp && grep " osv-scanner_linux_amd64$" osv-scanner_SHA256SUMS | sha256sum --check)
          chmod +x "${BIN}"
          "${BIN}" scan source -r . --format=table

  # CycloneDX 产出后端 SBOM；许可证 allowlist 失败即阻断。
  sbom-license:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: sbom
        run: ./mvnw -B -q org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom
      - name: license gate
        run: node scripts/license-guard.mjs target/bom.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: target/bom.json
          if-no-files-found: error
          retention-days: 30

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 安装 shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends shellcheck
      - name: actionlint
        run: |
          VERSION=1.7.12
          BASE="https://github.com/rhysd/actionlint/releases/download/v${VERSION}"
          curl -sSfL "${BASE}/actionlint_${VERSION}_checksums.txt" -o /tmp/actionlint.sha
          curl -sSfL "${BASE}/actionlint_${VERSION}_linux_amd64.tar.gz" -o /tmp/actionlint.tgz
          (cd /tmp && grep " actionlint_${VERSION}_linux_amd64.tar.gz\$" actionlint.sha | sha256sum --check)
          sudo tar -xzf /tmp/actionlint.tgz -C /usr/local/bin actionlint
          actionlint -color
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: yamllint
        run: uvx yamllint==1.38.0 -c .yamllint.yml .github
