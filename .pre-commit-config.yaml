# 克隆后运行 `uvx pre-commit@4.0.0 install --install-hooks` 启用。
# 全量质量门禁（Spotless/PMD/SpotBugs/JaCoCo/ArchUnit）由 `./mvnw verify` 执行，
# 不塞进提交钩子；CI 见 .github/workflows/ci.yml 与 security.yml。
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-xml
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: local
    hooks:
      - id: commitcheck
        name: "提交信息（<type>(<scope>): 描述）"
        entry: scripts/commitcheck.sh --file
        language: system
        stages: [commit-msg]
