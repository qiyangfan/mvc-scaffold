# 生产/联调配置：--spring.profiles.active=mysql 启用
spring:
  datasource:
    # Connector/J 8 默认 utf8mb4 与服务器时区，无需显式声明字符集/时区参数；
    # allowPublicKeyRetrieval 用于 caching_sha2_password 且不使用 SSL 的本地/联调场景
    url: jdbc:mysql://localhost:3306/mvc_scaffold?allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: change-me
  # 表结构由 Flyway 在启动时自动迁移，不再需要人工先执行 SQL 脚本
  flyway:
    enabled: true
    baseline-on-migrate: true
  h2:
    console:
      enabled: false

dept:
  provider: remote
  remote:
    base-url: http://dept-service:8080
